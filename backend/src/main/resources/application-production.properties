server.port=${PORT:8080}

# Database - Render PostgreSQL
spring.datasource.url=jdbc:postgresql://dpg-d78og96uk2gs73du2010-a.virginia-postgres.render.com:5432/portfolio_db_ec9n
spring.datasource.username=portfolio_db_ec9n_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool - Optimized for Render free tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate - use 'update' so tables are auto-created
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# CORS Configuration for Vercel frontend (must match CorsConfig key)
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging - Reduced for performance
logging.level.root=WARN
logging.level.com.portfolio=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# JWT Secret
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
app.jwt.expiration=86400000

# Server optimization for low memory
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Spring Boot optimization
spring.main.banner-mode=off
spring.jmx.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

cohere.api.key=${COHERE_API_KEY:}
cohere.model=${COHERE_MODEL:command-r}
cohere.url=${COHERE_URL:https://api.cohere.com/v2/chat}
