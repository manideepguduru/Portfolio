# Local development configuration using H2 database
spring.datasource.url=jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging - access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# ── CORS ─────────────────────────────────────────────────────
portfolio.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174

# ── Logging ──────────────────────────────────────────────────
logging.level.com.portfolio=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

cohere.api.key=${COHERE_API_KEY:}
cohere.model=${COHERE_MODEL:command-r}
cohere.url=${COHERE_URL:https://api.cohere.com/v2/chat}
